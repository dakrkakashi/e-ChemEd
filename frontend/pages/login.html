<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In — e-chemEd | Sanjivani COE</title>
  
  <meta name="description" content="Sign in to e-chemEd Engineering Chemistry learning portal at Sanjivani College of Engineering.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/motion.css">

  <style>
    .login-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-4);
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(14, 116, 144, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(217, 119, 6, 0.05) 0%, transparent 40%);
    }

    .login-topbar {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      display: flex;
      gap: var(--space-2);
      z-index: 10;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-xl);
      position: relative;
    }

    .login-brand {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      object-fit: cover;
      margin-bottom: var(--space-3);
      border: 2px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .login-title {
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: var(--space-1);
      letter-spacing: -0.02em;
    }

    .login-title span {
      color: var(--brand-primary);
    }

    .login-subtitle {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .login-desc {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: var(--space-2);
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: var(--space-4);
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: var(--space-1);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding-right: 2.75rem;
    }

    .btn-toggle-password {
      position: absolute;
      right: 0.5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
    }

    .btn-toggle-password:hover {
      color: var(--text-main);
    }

    .demo-accounts-panel {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
    }

    .demo-accounts-title {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
    }

    .demo-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all var(--duration-fast) ease;
    }

    .demo-btn:hover {
      border-color: var(--brand-primary);
      background: var(--bg-surface-hover);
      transform: translateY(-1px);
    }

    .demo-role {
      display: block;
      font-weight: 600;
      color: var(--brand-primary);
    }

    .demo-user {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .login-footer-info {
      margin-top: var(--space-6);
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-muted);
      line-height: 1.5;
    }

    .auth-alert {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      line-height: 1.4;
      margin-bottom: var(--space-4);
      display: none;
    }

    .auth-alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--unit-5, #b91c1c);
      display: block;
    }

    .auth-alert.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #047857;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-viewport">
    <div class="login-topbar">
      <button type="button" class="btn-icon motion-toggle-btn" id="login-motion-toggle" aria-label="Toggle motion reduction" title="Toggle motion reduction">
        <span class="motion-icon-slot"></span>
      </button>
      <button type="button" class="btn-icon theme-toggle-btn" id="login-theme-toggle" aria-label="Switch theme mode" title="Switch theme mode">
        <span class="theme-icon-slot"></span>
      </button>
    </div>

    <main class="login-card" id="login-card" aria-labelledby="login-heading">
      <div class="login-brand">
        <img src="../assets/img/logo.jpg" alt="Sanjivani College Logo" class="login-logo" width="56" height="56">
        <h1 class="login-title" id="login-heading">e-chem<span>Ed</span></h1>
        <div class="login-subtitle">Sanjivani College of Engineering</div>
        <p class="login-desc">Department of Engineering Science &amp; Humanities<br>First-Year Engineering Chemistry Portal</p>
      </div>

      <div id="auth-alert" class="auth-alert" role="alert" aria-live="assertive"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username-input" class="form-label">Username or PRN</label>
          <input 
            type="text" 
            id="username-input" 
            class="form-control" 
            placeholder="e.g., student or admin" 
            autocomplete="username" 
            required 
            autofocus>
        </div>

        <div class="form-group">
          <label for="password-input" class="form-label">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password-input" 
              class="form-control" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required>
            <button 
              type="button" 
              id="btn-toggle-password" 
              class="btn-toggle-password" 
              aria-label="Toggle password visibility">
              Show
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; min-height: 44px; margin-top: var(--space-2); justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="btn-login-text">Sign In</span>
        </button>
      </form>

      <!-- Quick-Fill Demo Accounts -->
      <section class="demo-accounts-panel" aria-labelledby="demo-panel-title">
        <div class="demo-accounts-title" id="demo-panel-title">
          <span>Quick Demo Access</span>
          <span style="font-weight: normal; font-size: 10px;">Click to Fill</span>
        </div>
        <div class="demo-buttons-grid">
          <button type="button" class="demo-btn" id="btn-demo-student">
            <span class="demo-role">Student Demo</span>
            <span class="demo-user">user: student</span>
          </button>
          <button type="button" class="demo-btn" id="btn-demo-admin">
            <span class="demo-role">Faculty Admin</span>
            <span class="demo-user">user: admin</span>
          </button>
        </div>
      </section>

      <div class="login-footer-info">
        <p>Protected Academic Learning Environment</p>
        <p style="font-size: 10px; margin-top: 2px;">SQLite Authentication &bull; Salted scrypt Hashes &bull; Zero Cloud PII</p>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/motion.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>

  <script>
    (function () {
      'use strict';

      const form = document.getElementById('login-form');
      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');
      const togglePasswordBtn = document.getElementById('btn-toggle-password');
      const submitBtn = document.getElementById('btn-submit-login');
      const loginText = document.getElementById('btn-login-text');
      const alertBox = document.getElementById('auth-alert');
      const card = document.getElementById('login-card');

      const btnDemoStudent = document.getElementById('btn-demo-student');
      const btnDemoAdmin = document.getElementById('btn-demo-admin');

      // Toggle password visibility
      togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        this.textContent = isPassword ? 'Hide' : 'Show';
        this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });

      // Demo quick fills
      btnDemoStudent.addEventListener('click', function () {
        usernameInput.value = 'student';
        passwordInput.value = 'student123';
        passwordInput.focus();
        hideAlert();
      });

      btnDemoAdmin.addEventListener('click', function () {
        usernameInput.value = 'admin';
        passwordInput.value = 'admin123';
        passwordInput.focus();
        hideAlert();
      });

      function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = `auth-alert ${isError ? 'error' : 'success'}`;
        alertBox.style.display = 'block';
        if (isError && window.EchemMotion && window.EchemMotion.shake) {
          window.EchemMotion.shake(card);
        }
      }

      function hideAlert() {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      }

      // Check URL redirect parameter
      function getRedirectTarget() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect && redirect.startsWith('/') && !redirect.includes('login.html')) {
          return redirect;
        }
        return '../index.html';
      }

      // Form submission
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username) {
          showAlert('Please enter your username or PRN.');
          usernameInput.focus();
          return;
        }

        if (!password) {
          showAlert('Please enter your password.');
          passwordInput.focus();
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        loginText.textContent = 'Verifying credentials...';

        try {
          const res = await window.EchemAuth.login(username, password);
          showAlert(`Welcome, ${res.user.name}! Redirecting...`, false);

          setTimeout(() => {
            const target = getRedirectTarget();
            window.location.href = target;
          }, 400);

        } catch (err) {
          showAlert(err.message || 'Invalid username or password.');
          submitBtn.disabled = false;
          loginText.textContent = 'Sign In';
          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      // If user is already authenticated and visits login page, offer redirect
      window.addEventListener('echemed:auth-changed', function (e) {
        if (e.detail && e.detail.user) {
          showAlert(`Already signed in as ${e.detail.user.name} (${e.detail.user.role === 'admin' ? 'Faculty Admin' : 'Student'}). Redirecting...`, false);
          setTimeout(() => {
            window.location.href = getRedirectTarget();
          }, 800);
        }
      });
    })();
  </script>
</body>
</html>
