<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mind Maps — e-chemEd | Sanjivani COE</title>
  
  <meta name="description" content="Visual syllabus mind maps for Engineering Chemistry first-year curriculum.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/motion.css">
</head>
<body>

  <!-- Shared Header -->
  <header id="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Mind Maps</span>
      </nav>

      <!-- Page Header -->
      <div class="page-header-reveal" style="margin-bottom: var(--space-8);">
        <h1>Unit-wise Mind Maps</h1>
        <p class="text-secondary" style="max-width: 65ch;">
          High-yield visual summaries connecting chemical reactions, mechanisms, industrial applications, 
          and formulas to enhance quick recall and conceptual mastery.
        </p>
      </div>

      <!-- Mind Maps Units Grid -->
      <h2 class="sr-only">Course Units Mind Maps</h2>
      <div class="grid gap-6" id="mindmaps-grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));">
        <!-- Rendered dynamically by JS -->
      </div>

    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="../assets/js/data-store.js"></script>
  <script src="../assets/js/motion.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/search.js"></script>

  <script>
    (async function () {
      'use strict';
      try {
        const loader = window.loadEchemData || (p => fetch(p).then(r => r.json()));
        const units = await loader('../data/units.json');
        const grid = document.getElementById('mindmaps-grid');

        grid.innerHTML = units.map((unit, idx) => {
          if (unit.status === 'live') {
            return `
              <div class="card reveal-on-scroll" data-stagger-item="${idx + 1}" style="border-top: 4px solid var(--unit-${unit.unitNumber}); display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-3);">
                    <span class="badge badge-live">Available Now</span>
                    <strong style="color:var(--unit-${unit.unitNumber}); font-size:var(--text-sm);">UNIT ${unit.unitNumber}</strong>
                  </div>
                  <h3 style="font-size:var(--text-xl); margin-bottom:var(--space-2);">${unit.title}</h3>
                  <p class="text-sm text-secondary" style="margin-bottom:var(--space-6);">${unit.description}</p>
                </div>

                <div style="display:flex; gap:var(--space-3); flex-wrap:wrap; margin-top:var(--space-4); border-top:1px solid var(--border-light); padding-top:var(--space-4);">
                  <a href="../assets/docs/unit1-mind-maps.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm flex-1" onclick="window.EchemProgress.markActivity(1, 'mindMapRead')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    View Mind Map PDF &rarr;
                  </a>
                  <a href="../assets/docs/unit1-mind-maps.pdf" download class="btn btn-secondary btn-sm" aria-label="Download Unit 1 Mind Map PDF">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  </a>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="card reveal-on-scroll" data-stagger-item="${idx + 1}" style="border-top: 4px solid var(--border-medium); display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-3);">
                    <span class="badge badge-soon">Coming Soon</span>
                    <strong style="color:var(--text-secondary); font-size:var(--text-sm);">UNIT ${unit.unitNumber}</strong>
                  </div>
                  <h3 style="font-size:var(--text-xl); margin-bottom:var(--space-2);">${unit.title}</h3>
                  <p class="text-sm text-secondary" style="margin-bottom:var(--space-6);">${unit.description}</p>
                </div>

                <div style="margin-top:var(--space-4); border-top:1px solid var(--border-light); padding-top:var(--space-4);">
                  <button type="button" class="btn btn-secondary btn-sm btn-disabled" disabled style="width:100%;" title="Mind Map document under preparation">
                    Document in Preparation
                  </button>
                </div>
              </div>
            `;
          }
        }).join('');

        if (window.EchemMotion && window.EchemMotion.refresh) {
          window.EchemMotion.refresh();
        }
      } catch (err) {
        console.error('Error rendering mind maps:', err);
      }
    })();
  </script>
</body>
</html>
