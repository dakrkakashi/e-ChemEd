<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle geometric chemical grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <polygon points="200,100 280,146 280,238 200,284 120,238 120,146"/>
    <polygon points="360,100 440,146 440,238 360,284 280,238 280,146"/>
    <polygon points="1000,450 1080,496 1080,588 1000,634 920,588 920,496"/>
    <polygon points="1160,450 1240,496 1240,588 1160,634 1080,588 1080,496"/>
  </g>

  <!-- College & Department Badge -->
  <rect x="80" y="80" width="480" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
  <text x="100" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="1">SANJIVANI COLLEGE OF ENGINEERING</text>

  <!-- Lecture Title -->
  <text x="80" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f59e0b" letter-spacing="2">ENGINEERING CHEMISTRY // UNIT 1</text>
  <text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Water Processing &amp;</text>
  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Environmental Sustainability</text>

  <!-- Department Info -->
  <text x="80" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Department of Engineering Science &amp; Humanities</text>

  <!-- Central Play Button with pulse aura -->
  <g transform="translate(980, 360)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="76" fill="url(#playGrad)"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4"/>
    <polygon points="-16,-30 32,0 -16,30" fill="#ffffff"/>
  </g>

  <!-- Bottom info bar -->
  <rect x="80" y="600" width="1120" height="2" fill="rgba(255,255,255,0.15)"/>
  <text x="80" y="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">Interactive Video Lecture &bull; High Definition &bull; e-chemEd First Year Curriculum</text>
</svg>
